<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="技术型产品经理转商业的待读清单：核心要点引导、可核查原文摘抄、读书历程记录，支持多端同步。" />
<meta name="theme-color" content="#12141c" />
<title>读书清单 · 技术 PM 转商业</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
/* ============================================================
   主题变量
   ============================================================ */
:root{
  --bg:#f7f3ea; --card:#fffdf8; --card2:#fbf7ee; --ink:#23201a; --muted:#7a7367;
  --line:#e7ddca; --accent:#b4791f; --ok:#2f8f5b; --warn:#b8761f; --bad:#c0483f;
  --shadow:0 2px 10px rgba(60,45,20,.07); --shadow2:0 6px 24px rgba(60,45,20,.12);
  --radius:16px;
}
html[data-theme="dark"]{
  --bg:#12141c; --card:#1b1e28; --card2:#191c25; --ink:#eae6dc; --muted:#9a958a;
  --line:#2c3141; --accent:#e8b04b; --ok:#4ec98a; --warn:#e0a94b; --bad:#e8736a;
  --shadow:0 2px 12px rgba(0,0,0,.35); --shadow2:0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
.serif{font-family:ui-serif,Georgia,"Songti SC","Noto Serif SC",serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* ============================================================
   布局骨架
   ============================================================ */
.wrap{max-width:880px;margin:0 auto;padding:0 16px 96px}
header.top{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);
}
.top-in{max-width:880px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(150deg,var(--accent),#8a5a12);display:inline-block}
.top-spacer{flex:1}
.icon-btn{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;
  color:var(--muted);border:1px solid transparent
}
.icon-btn:hover{background:var(--card);border-color:var(--line);color:var(--ink)}
.back-btn{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);padding:6px 10px 6px 4px;border-radius:10px}
.back-btn:hover{background:var(--card);color:var(--ink)}

/* 底部导航 */
nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(180%) blur(14px);
  padding-bottom:env(safe-area-inset-bottom)
}
.tabbar-in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabbar button{
  padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;color:var(--muted);transition:color .15s
}
.tabbar button .ti{font-size:19px;line-height:1.1}
.tabbar button.on{color:var(--accent);font-weight:600}

/* ============================================================
   通用组件
   ============================================================ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.pad{padding:16px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:1.2px;margin:26px 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.6}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:14px;font-weight:500;transition:.15s
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .btn.primary{color:#1a1206}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}
input[type=text],input[type=password],input[type=date],textarea,select{
  width:100%;padding:9px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--card2);outline:none;transition:.15s
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--card)}
textarea{resize:vertical;line-height:1.6;min-height:64px}
label.fld{display:block;margin-bottom:11px}
label.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:10px;opacity:.6}

/* 进度条 */
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}

/* ============================================================
   书架
   ============================================================ */
.stat-card{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;overflow:hidden}
.stat{padding:14px 10px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-size:21px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}

.book-card{padding:15px;display:block;width:100%;text-align:left;transition:.18s;border-radius:var(--radius);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-top:14px}
.book-card:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.bc-top{display:flex;gap:13px;align-items:flex-start}
.cover{
  width:52px;height:74px;border-radius:5px 9px 9px 5px;flex:none;position:relative;
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 92%,#fff),color-mix(in srgb,var(--c) 72%,#000));
  box-shadow:0 3px 10px color-mix(in srgb,var(--c) 35%,transparent);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:rgba(0,0,0,.22)}
.cover span{font-size:10px;color:#fff;writing-mode:vertical-rl;letter-spacing:1.5px;font-weight:700;
  text-shadow:0 1px 3px rgba(0,0,0,.35);padding:4px 0;max-height:100%;overflow:hidden}
.bc-info{flex:1;min-width:0}
.bc-info h3{font-size:16.5px;margin-bottom:2px;font-weight:700}
.bc-sub{font-size:12.5px;color:var(--muted);margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-prog{display:flex;align-items:center;gap:9px;margin-top:9px}
.bc-prog .bar{flex:1}
.bc-prog b{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.ring{width:46px;height:46px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-variant-numeric:tabular-nums}

/* ============================================================
   书籍详情
   ============================================================ */
.book-hero{display:flex;gap:16px;align-items:flex-start;padding:18px 16px}
.book-hero .cover{width:74px;height:106px}
.book-hero .cover span{font-size:11px}
.hero-meta h1{font-size:20px;line-height:1.35}
.hero-meta .en{font-size:12.5px;color:var(--muted);margin:2px 0 5px;font-style:italic}
.value-card{padding:14px 16px;border-left:3px solid var(--c);border-radius:12px;background:var(--card2)}
.value-card h3{font-size:12.5px;color:var(--muted);letter-spacing:.8px;margin-bottom:6px;font-weight:700}

/* 要点 */
.point{padding:14px 15px}
.point+.point{border-top:1px solid var(--line)}
.pt-head{display:flex;gap:11px;align-items:flex-start;cursor:pointer}
.pt-idx{
  width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--muted);
  font-variant-numeric:tabular-nums;margin-top:1px
}
.point.done .pt-idx{background:var(--ok);border-color:var(--ok);color:#fff}
html[data-theme="dark"] .point.done .pt-idx{color:#0d1a12}
.pt-t{flex:1;min-width:0}
.pt-t h3{font-size:15px;line-height:1.5;font-weight:650}
.pt-t .where{font-size:11.5px;color:var(--muted);margin-top:3px}
.pt-caret{color:var(--muted);font-size:13px;transition:transform .2s;padding:2px 4px}
.point.open .pt-caret{transform:rotate(90deg)}
.pt-body{display:none;margin-top:12px;padding-left:35px}
.point.open .pt-body{display:block}
.pt-body .what{margin-bottom:9px}
.pt-body .why{font-size:13.5px;color:var(--muted);padding-left:11px;border-left:2px solid var(--line);margin-bottom:13px}
.pt-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.toggle-done{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;
  border:1px solid var(--line);font-size:13px;background:var(--card)
}
.toggle-done.on{background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:var(--ok);color:var(--ok);font-weight:600}

/* 摘抄 */
.quote{margin:9px 0;padding:11px 13px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.quote .en{font-size:13.5px;line-height:1.6;color:var(--ink);font-family:ui-serif,Georgia,serif}
.quote .zh{font-size:13.5px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.quote .src{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qnote{font-size:11.5px;color:var(--muted);margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);line-height:1.55}
.qnote::before{content:"ⓘ "}
.sec-hint{font-size:12.5px;color:var(--muted);line-height:1.6;margin:-4px 0 10px;padding-left:2px}
.dot-ind{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot-ind.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot-ind.bad{background:var(--muted);opacity:.45}
.quote.read{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.myq{padding:10px 12px;border-radius:11px;background:color-mix(in srgb,var(--accent) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 26%,var(--line));margin:8px 0;position:relative}
.myq .t{font-size:13.5px;white-space:pre-wrap}
.myq .m{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;align-items:center}
.myq .del{position:absolute;top:7px;right:9px;color:var(--muted);font-size:13px;opacity:.5}
.myq .del:hover{opacity:1;color:var(--bad)}
.slot{
  padding:11px 13px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--muted) 45%,transparent);
  color:var(--muted);font-size:12.5px;text-align:center;margin:9px 0
}
.sub-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.8px;margin:15px 0 6px}

/* 热力图 */
.hm-wrap{display:flex;gap:6px;align-items:stretch}
.hm-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:9.5px;color:var(--muted)}
.hm-days span{display:flex;align-items:center;justify-content:center;line-height:1}
.hm{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;flex:1;max-width:470px}
.hm-col{display:grid;grid-template-rows:repeat(7,auto);gap:3px}
.hm-c{aspect-ratio:1;width:100%;border-radius:4px;background:var(--line);display:block}
.hm-c.l1{background:color-mix(in srgb,var(--accent) 32%,var(--line))}
.hm-c.l2{background:color-mix(in srgb,var(--accent) 62%,var(--line))}
.hm-c.l3{background:var(--accent)}
.hm-c.fut{opacity:.22}
.hm-legend{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-top:12px}
.hm-legend .hm-c{width:11px;height:11px;aspect-ratio:auto}

/* ============================================================
   历程
   ============================================================ */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.tl-day{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 8px;position:relative;left:-26px;padding-left:26px}
.tl-item{position:relative;padding:7px 0 7px 0;font-size:13.5px}
.tl-item::before{
  content:"";position:absolute;left:-22px;top:13px;width:9px;height:9px;border-radius:50%;
  background:var(--card);border:2px solid var(--accent)
}
.tl-item .tm{font-size:11.5px;color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
.tl-item .bk{font-size:11.5px;color:var(--muted);display:block;margin-top:1px}
.tl-item.ok::before{background:var(--ok);border-color:var(--ok)}

/* ============================================================
   设置
   ============================================================ */
.set-row{display:flex;align-items:center;gap:12px;padding:13px 0}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .lab{flex:1;min-width:0}
.set-row .lab b{font-weight:600;font-size:14.5px;display:block}
.set-row .lab span{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card2)}
.seg button{padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
html[data-theme="dark"] .seg button.on{color:#1a1206}
.status{font-size:12.5px;color:var(--muted);margin-top:9px;min-height:18px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--card2);
  padding:2px 6px;border-radius:6px;border:1px solid var(--line)}
details.tips{margin-top:11px;font-size:12.5px;color:var(--muted)}
details.tips summary{cursor:pointer;color:var(--accent)}
details.tips .in{padding:9px 0 2px}

/* toast */
#toast{
  position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);z-index:60;
  background:#2b2b2b;color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.25s;max-width:82vw;text-align:center;box-shadow:var(--shadow2)
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad)}
#toast.ok{background:var(--ok)}
@media (max-width:520px){
  .stat b{font-size:18px}
  .wrap{padding:0 12px 96px}
  .pt-body{padding-left:0}
  .book-hero{padding:15px 13px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in" id="topbar"></div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabbar">
  <div class="tabbar-in" id="tabbar"></div>
</nav>

<div id="toast"></div>

<script>
/* ============================================================
   1. 书单内容数据
   —— 由检索核实生成：要点用于引导阅读；原文引用只保留可公开
      核查的，核查不到的放进 doubtful；没有可核查原文的要点留空位，
      由「我的摘抄」承接。
   ============================================================ */
/* @BOOKS_START@ */
const BOOKS = [
  {
    "id": "renshi",
    "title": "认识商业",
    "en": "Understanding Business",
    "author": "威廉·尼科尔斯 / 詹姆斯·麦克休 / 苏珊·麦克休（William G. Nickels / James M. McHugh / Susan M. McHugh）",
    "edition": "首版 1987；McGraw-Hill 持续更新至第 13 版（2021）。中译：世界图书出版公司 2009（第 8 版）；后浪·世界图书 2016 与四川人民 2018（插图修订第 10 版）；机械工业出版社·华章 2020（原书第 12 版，何峻/许俊农 译）、2022 平装本；原书第 13 版中译（何峻 译）",
    "color": "#c9862b",
    "spine": "商业",
    "quoteNote": "这本书是教材，值得摘抄的「金句」其实就是它的定义句。以下英文原句均在 Google Books 电子版全文做逐字短语检索命中（对应 2012 全球版内容），是四本书里核查强度最高的一批——但要注意中译本各版章节划分不同（第 10 版中译与第 12/13 版中译的章号不一致），对照页码时请按自己手上的版本核对。",
    "value": "它提供的是一整套把产品语言翻译成经营语言的公共词汇表——利润与现金流、利益相关者、资本结构与融资、营销组合、组织与控制——让你第一次能用「整家公司的损益与风险」这把尺子做决策，而不是「这个功能好不好」这把尺子。",
    "points": [
      {
        "id": "rs-1",
        "name": "商业与利润的定义：一切经营活动必须落到正利润",
        "what": "商业是「为他人提供商品与服务、并在此过程中获利」的活动；利润 = 收入 − 支出，支出大于收入即为亏损。",
        "why": "全书的地基，也是转型的第一道心锚：它把「做功能、做体验」重新锚定为「必须产生正利润的商业活动」，并引入「风险—报酬」对称性——你承担风险，才有资格谈报酬。",
        "where": "第 1 章 动态商业环境中的冒险与获利",
        "quotes": [
          {
            "en": "business Any activity that seeks to provide goods and services to others while operating at a profit.",
            "zh": "",
            "src": "https://books.google.com/books/feeds/volumes?q=%22business+is+any+activity+that+seeks+to+provide+goods+and+services%22",
            "conf": "verified",
            "note": "Google Books 电子版全文逐字命中。这是教材里的定义原文，值得逐字记住"
          },
          {
            "en": "Profit is the amount of money a business earns above and beyond what it spends for salaries and other expenses needed to run the operation. A loss occurs when a business's expenses are more than its revenues.",
            "zh": "",
            "src": "https://books.google.com/books/feeds/volumes?q=%22the+total+amount+of+money+a+business+takes+in+during+a+given+period%22",
            "conf": "verified",
            "note": "Google Books 全文逐字命中。同处还给出 revenue（一段时期内通过销售获得的全部金额）的定义"
          }
        ]
      },
      {
        "id": "rs-2",
        "name": "利益相关者视角：不是只对用户负责",

const BOOK_IX = Object.fromEntries(BOOKS.map(b => [b.id, b]));

/* ============================================================
   2. 状态存储
   ============================================================ */
const LS_KEY = "dushu_v1";

function blankBook(){
  return { status:"unread", startedAt:null, finishedAt:null, currentWhere:"",
           points:{}, quotesRead:{}, notes:{}, mine:[], review:"", _ts:0 };
}
function blankState(){
  return { v:1, books:Object.fromEntries(BOOKS.map(b => [b.id, blankBook()])),
           events:[], theme:"auto", _ts:Date.now() };
}
let S = blankState();

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const j = JSON.parse(raw);
    S = Object.assign(blankState(), j);
    S.books = Object.assign(Object.fromEntries(BOOKS.map(b => [b.id, blankBook()])), j.books || {});
    BOOKS.forEach(b => { S.books[b.id] = Object.assign(blankBook(), S.books[b.id]); });
    S.events = j.events || [];
  }catch(e){ console.warn("读取本地数据失败", e); }
}
function save(opts){
  if(!(opts && opts.silent)) S._ts = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ toast("本地保存失败：" + e.message, "err"); }
  if(!(opts && opts.noSync)) schedulePush();
}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const fmtTime = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };
const fmtDate = ts => { const d = new Date(ts); return (d.getMonth()+1) + "月" + d.getDate() + "日"; };
const fmtDateFull = ts => { const d = new Date(ts); return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日"; };
const todayISO = () => dayKey(Date.now());

let toastTimer = null;
function toast(msg, kind){
  const el = $("#toast");
  el.textContent = msg;
  el.className = "show " + (kind || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = kind || ""; }, 2200);
}

function addEvent(type, bookId, text){
  S.events.push({ id: uid(), ts: Date.now(), type, bookId, text });
  if(S.events.length > 800) S.events = S.events.slice(-800);
}

/* 进度统计 */
function bookStats(b){
  const st = S.books[b.id];
  const done = b.points.filter(p => st.points[p.id] > 0).length;
  const total = b.points.length;
  return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
}
function overallStats(){
  let done = 0, mine = 0, finished = 0, reading = 0;
  BOOKS.forEach(b => {
    const s = bookStats(b);
    done += s.done;
    mine += (S.books[b.id].mine || []).length;
    if(S.books[b.id].status === "done") finished++;
    else if(S.books[b.id].status === "reading") reading++;
  });
  return { done, mine, finished, reading, total:TOTAL_POINTS,
           pct: TOTAL_POINTS ? Math.round(done / TOTAL_POINTS * 100) : 0 };
}
function streakDays(){
  const days = new Set(S.events.map(e => dayKey(e.ts)));
  if(!days.size) return 0;
  let n = 0;
  const d = new Date();
  if(!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);   // 今天还没读，从昨天起算
  while(days.has(dayKey(d.getTime()))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- 书架 ---------- */
function ring(pct, color, size){
  size = size || 46;
  const r = (size - 6) / 2, c = 2 * Math.PI * r;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct/100)}"/>
    </svg><b>${pct}%</b></div>`;
}

function pointHtml(b, p, i){
  const bst = S.books[b.id];
  const done = bst.points[p.id] > 0;
  const isOpen = openPoints.has(p.id);
  const quotes = (p.quotes || []);
  const mine = (bst.mine || []).filter(m => m.pid === p.id);

  const quoteHtml = quotes.map((q, qi) => {
    const qid = p.id + ":" + qi;
    const read = bst.quotesRead[qid] > 0;
    const cf = CONF[q.conf] || CONF.unverified;
    return `<div class="quote ${read ? "read" : ""}">
      ${q.en ? `<div class="en">“${esc(q.en)}”</div>` : ""}
      ${q.zh ? `<div class="zh">${esc(q.zh)}</div>` : ""}
      <div class="src">
        <span class="pill ${cf.c}">${cf.t}</span>
        ${q.src ? `<a href="${esc(q.src)}" target="_blank" rel="noopener">出处 ↗</a>` : ""}
        <button class="btn sm ghost" data-qread="${b.id}|${qid}" style="margin-left:auto">
          ${read ? "✓ 已读到" : "标记已读到"}</button>
      </div>
      ${q.note ? `<div class="qnote">${esc(q.note)}</div>` : ""}</div>`;
  }).join("");

  const slotHtml = quotes.length ? "" :
    `<div class="slot">这一条没有可公开核查的原文 —— 读到好句子时，用下面的「我的摘抄」记下来</div>`;

  return `<div class="point ${done ? "done" : ""} ${isOpen ? "open" : ""}" data-point="${p.id}">
    <div class="pt-head" data-toggle="${p.id}">
      <div class="pt-idx">${done ? "✓" : i + 1}</div>
      <div class="pt-t">
        <h3>${esc(p.name)}</h3>
        ${p.where ? `<div class="where">${esc(p.where)}</div>` : ""}
      </div>
      <div class="pt-caret">›</div>
    </div>
    <div class="pt-body">
      ${p.what ? `<div class="what">${esc(p.what)}</div>` : ""}
      ${p.why ? `<div class="why">${esc(p.why)}</div>` : ""}
      <div class="pt-actions">
        <button class="toggle-done ${done ? "on" : ""}" data-done="${b.id}|${p.id}">
          ${done ? "✓ 已理解" : "标记已理解"}</button>
      </div>

      <div class="sub-h">可核查原文（${quotes.length}）</div>
      ${quoteHtml}
      ${slotHtml}

      <div class="sub-h">我的摘抄（${mine.length}）</div>
      ${mine.map(m => `<div class="myq">
          <button class="del" data-delq="${b.id}|${m.id}">✕</button>
          <div class="t">${esc(m.text)}</div>
          <div class="m">${m.page ? `<span>${esc(m.page)}</span>` : ""}<span>${fmtDate(m.ts)}</span></div>
        </div>`).join("")}
      <div class="btn-row" style="margin-top:8px">
        <button class="btn sm" data-addq="${b.id}|${p.id}">＋ 添加摘抄</button>
      </div>

      <div class="sub-h">我的批注</div>
      <textarea data-note="${b.id}|${p.id}" placeholder="这一条让我想到…（自动保存）">${esc((bst.notes[p.id] || {}).text || "")}</textarea>
    </div>
  </div>`;
}

/* ---------- 历程 ---------- */
function heatmap(){
  const days = {};
  S.events.forEach(e => { const k = dayKey(e.ts); days[k] = (days[k] || 0) + 1; });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today);
  start.setDate(start.getDate() - 7 * 11);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));   // 对齐到周一
  let cols = "";
  for(let w = 0; w < 12; w++){
    let cells = "";
    for(let d = 0; d < 7; d++){
      const dt = new Date(start); dt.setDate(start.getDate() + w * 7 + d);
      const k = dayKey(dt.getTime()), n = days[k] || 0;
      const lvl = n === 0 ? 0 : n === 1 ? 1 : n <= 3 ? 2 : 3;
      const fut = dt > today;
      cells += `<i class="hm-c l${lvl}${fut ? " fut" : ""}" title="${k}${n ? " · " + n + " 次打卡" : " · 没读"}"></i>`;
    }
    cols += `<div class="hm-col">${cells}</div>`;
  }
  const first = dayKey(start.getTime()).slice(5).replace("-", "/");
  return `<div class="hm-wrap">
      <div class="hm-days"><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div>
      <div class="hm">${cols}</div>
    </div>
    <div class="hm-legend">
      <span>${first} 起 · 近 12 周</span>
      <span style="margin-left:auto">少</span>
      <i class="hm-c l0"></i><i class="hm-c l1"></i><i class="hm-c l2"></i><i class="hm-c l3"></i>
      <span>多</span>
    </div>`;
}

function viewJourney(){
  const o = overallStats();
  const heat = `<div class="card pad" style="margin-top:16px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:11px">
        <h2 style="flex:1">打卡热力图</h2>
        <span class="pill ${streakDays() ? "acc" : ""}">连续 ${streakDays()} 天</span>
      </div>${heatmap()}</div>`;
  const stats = `<div class="card stat-card" style="margin-top:16px">
      <div class="stat"><b>${streakDays()}</b><span>连续天数</span></div>
      <div class="stat"><b>${S.events.length}</b><span>累计打卡</span></div>
      <div class="stat"><b>${o.done}<span class="tiny muted">/${o.total}</span></b><span>已理解要点</span></div>
      <div class="stat"><b>${o.mine}</b><span>我的摘抄</span></div>
    </div>`;
  if(!S.events.length){
    return stats + heat + `<div class="card empty" style="margin-top:14px">
      <div class="big">📖</div>
      <div>还没有读书记录</div>
      <div class="hint" style="margin-top:6px">去书架点开一本书，开始你的第一天</div>
    </div>`;
  }
  const byDay = {};
  S.events.slice().sort((a, b) => b.ts - a.ts).forEach(e => {
    const k = dayKey(e.ts);
    (byDay[k] = byDay[k] || []).push(e);
  });
  const ICONS = { start:"▶️", point:"✓", quote:"✍️", finish:"🏁", reread:"↻" };
  const days = Object.keys(byDay).sort().reverse().map(k => {
    const items = byDay[k].map(e => `<div class="tl-item ${e.type === "finish" || e.type === "point" ? "ok" : ""}">
        ${ICONS[e.type] || "•"} ${esc(e.text)}<span class="tm">${fmtTime(e.ts)}</span>
        ${e.bookId && BOOK_IX[e.bookId] ? `<span class="bk">《${esc(BOOK_IX[e.bookId].title)}》</span>` : ""}
      </div>`).join("");
    const label = k === todayISO() ? "今天" : k;
    return `<div class="tl-day">${label} · ${byDay[k].length} 条</div>${items}`;
  }).join("");

  return stats + heat + `
    <div class="sec-title">读书历程</div>
    <div class="card pad"><div class="tl">${days}</div></div>
    <div style="height:8px"></div>`;
}

/* ============================================================
   5. 交互：事件委托
   ============================================================ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-open],[data-toggle],[data-done],[data-qread],[data-start],[data-finish],[data-reread],[data-addq],[data-delq],[data-settheme],[data-sy],[data-dismiss-sync]");
  if(!t) return;
  const d = t.dataset;

  if(d.dismissSync){ localStorage.setItem(SYNC_BANNER_KEY, "1"); render(); return; }
  if(d.go) return go(d.go);
  if(d.open) return go("book", d.open);

  if(d.settheme){ S.theme = d.settheme; applyTheme(); save(); render(); return; }

  if(d.toggle){
    if(openPoints.has(d.toggle)) openPoints.delete(d.toggle); else openPoints.add(d.toggle);
    render(); return;
  }
  if(d.done){
    const [bid, pid] = d.done.split("|");
    const b = BOOK_IX[bid], bst = S.books[bid];
    if(bst.points[pid] > 0){ bst.points[pid] = -Date.now(); }   // 墓碑：让「取消」也能同步出去
    else{
      bst.points[pid] = Date.now();
      const p = b.points.find(x => x.id === pid);
      addEvent("point", bid, "理解要点：「" + (p ? p.name : pid) + "」");
    }
    bst._ts = Date.now(); save(); render(); return;
  }
  if(d.qread){
    const [bid, qid] = d.qread.split("|");
    const bst = S.books[bid];
    if(bst.quotesRead[qid] > 0) bst.quotesRead[qid] = -Date.now();
    else{ bst.quotesRead[qid] = Date.now(); addEvent("quote", bid, "读到一条原文引用"); }
    bst._ts = Date.now(); save(); render(); return;
  }
  if(d.start || d.reread){
    const bid = d.start || d.reread, bst = S.books[bid];
    if(d.reread){ bst.status = "reading"; }
    else{ bst.status = "reading"; if(!bst.startedAt) bst.startedAt = Date.now(); }
    addEvent("start", bid, "开始阅读");
    bst._ts = Date.now(); save(); render(); toast("开始读啦，加油 📖", "ok"); return;
  }
  if(d.finish){
    const bid = d.finish, bst = S.books[bid];
    bst.status = "done"; bst.finishedAt = Date.now();
    if(!bst.startedAt) bst.startedAt = Date.now();
    addEvent("finish", bid, "读完了这本书 🏁");
    bst._ts = Date.now(); save(); render(); toast("恭喜读完一本 🎉", "ok"); return;
  }
  if(d.addq){
    const [bid, pid] = d.addq.split("|");
    pendingQuote = { bid, pid };
    renderQuoteModal();
    return;
  }
  if(d.delq){
    const [bid, qid] = d.delq.split("|");
    const bst = S.books[bid];
    bst.mine = (bst.mine || []).filter(m => m.id !== qid);
    bst._ts = Date.now(); save(); render(); toast("已删除"); return;
  }
  if(d.sy) return handleSync(d.sy);
});

/* 文本输入自动保存（失焦或停顿后） */
let saveTimer = null;
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset && t.dataset.note){
    const [bid, pid] = t.dataset.note.split("|");
    const st = S.books[bid];
    st.notes[pid] = { text:t.value, ts:Date.now() };
    st._ts = Date.now();
    clearTimeout(saveTimer); saveTimer = setTimeout(() => save(), 600);
  }
  if(t.dataset && t.dataset.review){
    const bid = t.dataset.review, st = S.books[bid];
    st.review = t.value; st._ts = Date.now();
    clearTimeout(saveTimer); saveTimer = setTimeout(() => save(), 600);
  }
  if(t.dataset && t.dataset.where){
    const bid = t.dataset.where, st = S.books[bid];
    st.currentWhere = t.value; st._ts = Date.now();
    clearTimeout(saveTimer); saveTimer = setTimeout(() => save(), 600);
  }
});

  const b = BOOK_IX[pendingQuote.bid];
  const el = document.createElement("div");
  el.id = "qmodal";
  el.innerHTML = `<div style="position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);
      display:flex;align-items:flex-end;justify-content:center;padding:0"
      onclick="if(event.target===this)closeQuoteModal()">
    <div class="card" style="width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px;
        max-height:88vh;overflow:auto">
      <h2 style="margin-bottom:4px">添加摘抄</h2>
      <div class="hint" style="margin-bottom:12px">《${esc(b.title)}》</div>
      <label class="fld"><span>原文 / 你的转述</span>
        <textarea id="qText" placeholder="把书里那句让你停下来的话写在这里…" style="min-height:110px"></textarea></label>
      <label class="fld"><span>页码 / 位置（可选）</span>
        <input type="text" id="qPage" placeholder="例如 P.128 / 第 4 章" /></label>
      <div class="btn-row">
        <button class="btn primary" id="qSave">保存</button>
        <button class="btn ghost" onclick="closeQuoteModal()">取消</button>
      </div>
    </div></div>`;
  document.body.appendChild(el);
  setTimeout(() => { const x = $("#qText"); if(x) x.focus(); }, 60);
  $("#qSave").onclick = () => {

    const bst = S.books[pendingQuote.bid];
    bst.mine = bst.mine || [];
    bst.mine.push({ id:uid(), pid:pendingQuote.pid, text, page:$("#qPage").value.trim(), ts:Date.now() });
    bst._ts = Date.now();
    addEvent("quote", pendingQuote.bid, "记下一条摘抄");

}
function closeQuoteModal(){ const el = $("#qmodal"); if(el) el.remove(); pendingQuote = null; }

/* ============================================================
   7. 云同步（GitHub 私有仓库 · Contents API）
   ============================================================ */
/* owner / repo / path 已内置在应用里——用户不需要知道也不需要填写。
   唯一留在本机的是访问令牌（原因见 README「安全说明」）。 */
const SYNC_DEFAULTS = { owner:"KaraChenDS", repo:"reading-list-data", path:"reading-list.json" };
const SY_KEY = "dushu_sync_v1", SY_AUTO_KEY = "dushu_sync_auto";
let pushTimer = null, pullTimer = null;

function syncSettings(){
  let j = {};
  try{ j = JSON.parse(localStorage.getItem(SY_KEY)) || {}; }catch(e){}
  return { owner:j.owner || SYNC_DEFAULTS.owner,
           repo: j.repo  || SYNC_DEFAULTS.repo,
           path: j.path  || SYNC_DEFAULTS.path,
           token:j.token || "" };
}
function saveSyncSettings(o){ localStorage.setItem(SY_KEY, JSON.stringify(o)); }
function isSyncAuto(){ return localStorage.getItem(SY_AUTO_KEY) !== "0"; }
function isConnected(){ return !!syncSettings().token; }
function syncTarget(){ const s = syncSettings(); return s.owner + "/" + s.repo; }
function syncUrl(){
  const s = syncSettings();
  return "https://api.github.com/repos/" + encodeURIComponent(s.owner) + "/" + encodeURIComponent(s.repo) +
         "/contents/" + encodeURIComponent(s.path).replace(/%2F/g, "/");
}
function syHeaders(tok){ return { Authorization:"Bearer " + tok, Accept:"application/vnd.github+json" }; }
function b64enc(str){
  const bytes = new TextEncoder().encode(str); let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(b64.replace(/\s/g, "")); const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const SY_LAST_KEY = "dushu_last_sync", SY_ERR_KEY = "dushu_last_error";
function syStatus(msg){ const el = $("#syStatus"); if(el) el.textContent = msg || ""; }
function markSyncOK(){
  localStorage.setItem(SY_LAST_KEY, String(Date.now()));
  localStorage.removeItem(SY_ERR_KEY);
  paintSyncDot(true); paintSyncLine();
}
function markSyncFail(reason){
  localStorage.setItem(SY_ERR_KEY, String(reason || "未知错误"));
  paintSyncDot(false); paintSyncLine();
}
function humanAgo(ts){
  const d = Date.now() - ts;
  if(d < 60000) return "刚刚";
  if(d < 3600000) return Math.floor(d / 60000) + " 分钟前";
  if(d < 86400000) return Math.floor(d / 3600000) + " 小时前";
  return Math.floor(d / 86400000) + " 天前";
}
/* 设置页的状态行 + 书架上的异常提示都由这里驱动 */
function paintSyncLine(){
  const el = document.getElementById("syLine");
  if(el){
    if(!isConnected()){ el.textContent = ""; return; }
    const err = localStorage.getItem(SY_ERR_KEY);
    const last = Number(localStorage.getItem(SY_LAST_KEY) || 0);
    el.textContent = err ? "同步异常：" + err
      : (last ? "上次同步 " + humanAgo(last) + "（改动会自动上传）" : "已连接，等待首次同步…");
    el.style.color = err ? "var(--bad)" : "";
  }
  const banner = document.getElementById("syncWarn");
  if(banner) banner.remove();
  if(isConnected() && localStorage.getItem(SY_ERR_KEY)){
    const main = document.getElementById("view");
    if(main && route.name === "shelf"){
      const d = document.createElement("div");
      d.id = "syncWarn";
      d.className = "card pad";
      d.style.cssText = "margin-top:16px;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,transparent)";
      d.innerHTML = `<b style="font-size:14px;color:var(--bad)">同步出问题了</b>
        <div class="hint" style="margin-top:3px">${esc(localStorage.getItem(SY_ERR_KEY))}——本机记录不会丢，但暂时传不到其他设备。</div>
        <div class="btn-row" style="margin-top:9px">
          <button class="btn sm" data-sy="pull">重试</button>
          <button class="btn sm ghost" data-go="settings">去设置</button></div>`;
      main.insertBefore(d, main.firstChild);
    }
  }
}
function paintSyncDot(ok){
  const el = document.getElementById("syDot");
  if(el) el.className = "dot-ind " + (ok ? "ok" : "bad");
}

/* 同步载荷：剔除 token 之外的敏感项，token 本就不在 S 里 */
function syncPayload(){
  return { app:"读书清单", v:1, updatedAt:Date.now(), theme:S.theme, books:S.books, events:S.events };
}

/* 合并：册内的「集合类」字段取并集（打卡/已读引用/摘抄/批注逐条合并），
   只有「标量类」字段（状态、读到哪、读后感）才按整册 _ts 取较新的一侧。
   这样两台设备各记各的，谁也不会把对方的打卡覆盖掉。 */
function mergeRemote(remote){
  const r = remote || {};
  let changed = 0;
  BOOKS.forEach(b => {
    const a = S.books[b.id], c = (r.books || {})[b.id];
    if(!a || !c) return;
    const before = JSON.stringify(a);

    // —— 集合类：逐键合并，同一个键上「最后一次操作」生效 ——
    // 值为正数 = 该时刻完成；值为负数 = 该时刻取消（墓碑），所以取消操作也能跨设备生效
    const mergeByTime = (x, y) => {
      const A = x || {}, B = y || {}, out = {};
      new Set(Object.keys(A).concat(Object.keys(B))).forEach(k => {
        const p = A[k], q = B[k];
        if(p === undefined) out[k] = q;
        else if(q === undefined) out[k] = p;
        else out[k] = Math.abs(q) > Math.abs(p) ? q : p;
      });
      return out;
    };
    const points     = mergeByTime(a.points, c.points);
    const quotesRead = mergeByTime(a.quotesRead, c.quotesRead);

    const notes = Object.assign({}, c.notes || {}, a.notes || {});
    Object.keys(notes).forEach(pid => {            // 同一条批注取时间较新的
      const x = (a.notes || {})[pid], y = (c.notes || {})[pid];
      if(x && y) notes[pid] = ((y.ts || 0) > (x.ts || 0)) ? y : x;
    });

    const byId = {};
    (c.mine || []).concat(a.mine || []).forEach(m => { if(m && m.id) byId[m.id] = m; });
    const mine = Object.values(byId).sort((x, y) => (x.ts || 0) - (y.ts || 0));

    // —— 标量类：取 _ts 较新的一侧，但不让「空值」抹掉已有内容 ——
    const src = (c._ts || 0) > (a._ts || 0) ? c : a;
    const merged = Object.assign(blankBook(), {
      status:      src.status || a.status || c.status,
      startedAt:   a.startedAt || c.startedAt || null,
      finishedAt:  a.finishedAt || c.finishedAt || null,
      currentWhere:(src.currentWhere || a.currentWhere || c.currentWhere || ""),
      review:      (src.review || a.review || c.review || ""),
      _ts:         Math.max(a._ts || 0, c._ts || 0)
    }, { points, quotesRead, notes, mine });

    if(JSON.stringify(merged) !== before){ S.books[b.id] = merged; changed++; }
  });
  const seen = new Set(S.events.map(e => e.id));
  (r.events || []).forEach(e => { if(e && e.id && !seen.has(e.id)){ S.events.push(e); seen.add(e.id); changed++; } });
  S.events.sort((x, y) => x.ts - y.ts);
  // 主题是设备级偏好，不参与同步
  return changed;
}

async function syncPush(silent){
  const s = syncSettings();
  if(!s.token){ if(!silent) syStatus("本机还没有连接同步。"); return; }
  if(!silent) syStatus("正在上传…");
  try{
    let sha = null;
    const g = await fetch(syncUrl(), { headers:syHeaders(s.token) });
    if(g.ok) sha = (await g.json()).sha;
    const body = { message:"reading list sync " + new Date().toISOString(),
                   content:b64enc(JSON.stringify(syncPayload())) };
    if(sha) body.sha = sha;
    const r = await fetch(syncUrl(), { method:"PUT",
      headers:Object.assign({ "Content-Type":"application/json" }, syHeaders(s.token)),
      body:JSON.stringify(body) });
    if(!r.ok){
      const txt = (await r.text()).slice(0, 160);
      markSyncFail("上传失败 HTTP " + r.status);
      if(!silent) syStatus("上传失败 HTTP " + r.status + " " + txt);
      return;
    }
    markSyncOK();
    if(!silent) syStatus("已同步到云端 ✓");
  }catch(e){ markSyncFail("上传出错：" + e.message); if(!silent) syStatus("上传出错：" + e.message); }
}

async function syncPull(opts){
  const silent = !!(opts && opts.silent);
  const s = syncSettings();
  if(!s.token){ if(!silent) syStatus("本机还没有连接同步。"); return; }
  if(!silent) syStatus("正在下载云端…");
  try{
    const r = await fetch(syncUrl(), { headers:syHeaders(s.token) });
    if(r.status === 404){
      // 云端还没有文件：把本机数据推上去，完成首次引导
      if(!silent) syStatus("云端还没有数据，正在用本机数据创建…");
      return syncPush(silent);
    }
    if(!r.ok){
      markSyncFail("下载失败 HTTP " + r.status + (r.status === 401 || r.status === 403 ? "（令牌无效或权限不足）" : r.status === 404 ? "（仓库或路径不存在）" : ""));
      if(!silent) syStatus("下载失败 HTTP " + r.status + "（检查令牌权限）");
      return;
    }
    const j = await r.json();
    const n = mergeRemote(JSON.parse(b64dec(j.content)));
    if(n){ save({ silent:true, noSync:true }); render(); }
    markSyncOK();
    if(!silent) syStatus(n ? "已合并 " + n + " 处云端更新 ✓" : "云端与本地已一致");
    if(n && silent) toast("已合并其他设备的 " + n + " 处更新", "ok");
  }catch(e){ markSyncFail("网络出错：" + e.message); if(!silent) syStatus("下载出错：" + e.message); }
}

function schedulePush(){
  const s = syncSettings();
  if(!s.token || !isSyncAuto()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => syncPush(true), 2500);
}

function handleSync(act){
  const s = syncSettings();
  if(act === "connect"){
    const tok = ($("#syToken").value || "").trim();
    if(!tok){ syStatus("还没粘贴令牌。"); return; }
    saveSyncSettings(Object.assign({}, s, { token: tok }));
    render();
    toast("正在连接…");
    return syncPull();
  }
  if(act === "disconnect"){
    if(!confirm("断开后这台设备不再同步，本机数据仍保留。继续？")) return;
    saveSyncSettings(Object.assign({}, s, { token: "" }));
    render(); toast("已断开这台设备的同步");
    return;
  }
  if(act === "saverepo"){
    const full = ($("#syRepoFull").value || "").trim();
    const parts = full.split("/");
    if(parts.length !== 2 || !parts[0] || !parts[1]){ syStatus("仓库要写成 owner/repo 的形式。"); return; }
    saveSyncSettings(Object.assign({}, s, {
      owner: parts[0], repo: parts[1],
      path: ($("#syPath").value || "").trim() || "reading-list.json"
    }));
    render(); toast("仓库设置已保存", "ok");
    return;
  }
  if(act === "pull")  return syncPull();
  if(act === "push")  return syncPush();
  if(act === "export"){
    const blob = new Blob([JSON.stringify(syncPayload(), null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "读书清单-" + todayISO() + ".json";
    a.click(); URL.revokeObjectURL(a.href);
    toast("已导出 JSON", "ok"); return;
  }
  if(act === "import"){ $("#importFile").click(); return; }
  if(act === "reset"){
    if(confirm("清空所有阅读记录？云端数据需要另行覆盖，此操作不可撤销。")){
      localStorage.removeItem(LS_KEY);
      S = blankState(); applyTheme(); save({ noSync:true }); render();
      toast("已清空");
    }
    return;
  }
}

document.addEventListener("change", e => {
  // 失焦立即落盘，避免「边打字边点勾选」丢字
  if(e.target.dataset && e.target.dataset.note){
    const [bid, pid] = e.target.dataset.note.split("|");
    S.books[bid].notes[pid] = { text:e.target.value, ts:Date.now() };
    S.books[bid]._ts = Date.now();
    clearTimeout(saveTimer); save();
    return;
  }
  if(e.target.dataset && e.target.dataset.review){
    const bid = e.target.dataset.review;
    S.books[bid].review = e.target.value;
    S.books[bid]._ts = Date.now();
    clearTimeout(saveTimer); save();
    return;
  }
  if(e.target.dataset && e.target.dataset.where){
    const bid = e.target.dataset.where;
    S.books[bid].currentWhere = e.target.value;
    S.books[bid]._ts = Date.now();
    clearTimeout(saveTimer); save();
    return;
  }
  if(e.target.id !== "importFile") return;
  const f = e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const n = mergeRemote(JSON.parse(rd.result));
      save({ noSync:true }); render();
      toast(n ? "已导入并合并 " + n + " 处" : "没有新数据", "ok");
    }catch(err){ toast("导入失败：" + err.message, "err"); }
  };
  rd.readAsText(f);
  e.target.value = "";
});

/* ============================================================
   8. 主题与启动
   ============================================================ */
function applyTheme(){
  let th = S.theme || "auto";
  if(th === "auto") th = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", th);
  const meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute("content", th === "dark" ? "#12141c" : "#f7f3ea");
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if((S.theme || "auto") === "auto") applyTheme();
});

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

const SYNC_BANNER_KEY = "dushu_sync_banner";

/* 新设备一键连接：用 https://…/reading-list/#t=<令牌> 打开一次即可
   （令牌从地址栏里读走后就立刻抹掉，不留痕） */
function bootstrapTokenFromHash(){
  const m = /[#&]t=([^&]+)/.exec(location.hash || "");
  if(!m) return false;
  try{
    const tok = decodeURIComponent(m[1]).trim();
    if(!tok) return false;
    saveSyncSettings(Object.assign({}, syncSettings(), { token: tok }));
    history.replaceState(null, "", location.pathname + location.search);
    return true;
  }catch(e){ return false; }
}
bootstrapTokenFromHash();
// 页面已经打开着、又从别处收到带令牌的链接时（只变 hash 不重新加载）
window.addEventListener("hashchange", () => {
  if(bootstrapTokenFromHash()){ render(); autoPull(); }
});

load(); applyTheme(); render();

/* 同步完全自动化：打开时拉一次，从后台切回时再拉一次。
   失败一律静默——用户不需要知道同步的存在，只在真有更新时提示。 */
function autoPull(){
  if(!document.hidden && isConnected() && isSyncAuto()) syncPull({ silent:true });
}
setTimeout(autoPull, 700);
document.addEventListener("visibilitychange", () => { if(!document.hidden) autoPull(); });
window.addEventListener("online", autoPull);
</script>
